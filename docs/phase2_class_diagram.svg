<text x="32" y="1022" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-size="13">Legend:  + public  |  - private  |  arrow = uses  |  filled diamond = owns (composition)  |  dashed = creates</text>
<text x="32" y="1046" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-size="13">Inputs: stdin -&gt; FrontEnd (commands and fields); users, games and collections files -&gt; FileManager.</text>
<text x="32" y="1070" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-size="13">Outputs: stdout &lt;- FrontEnd (prompts and results); Daily Transaction File &lt;- FileManager at logout.</text>
<text x="32" y="1094" text-anchor="start" dominant-baseline="middle" xml:space="preserve" font-size="13">main.cpp builds FileManager, then TransactionProcessor, then FrontEnd, and calls FrontEnd::run().</text>
